<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lena Del Yarn">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F4EF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lena Del Yarn</title>
<style>
@font-face{font-family:Brico;src:url("fonts/BricolageGrotesque-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:Brico;src:url("fonts/BricolageGrotesque-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
:root{
  --paper:#F7F4EF; --card:#FFFFFF; --ink:#2A2038; --muted:#6F6879; --line:#E4DED5;
  --knit:#6C5CE7; --knit-soft:#ECE9FD; --crochet:#D45A2E; --crochet-soft:#FCE8DF;
  --accent:var(--knit); --accent-soft:var(--knit-soft);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body[data-craft="haekeln"]{--accent:var(--crochet);--accent-soft:var(--crochet-soft)}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 104px}

.bar{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;max-width:560px;margin:0 auto}
.bar h2{font-size:21px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back,.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.back{margin-left:-8px}.icon-btn{color:var(--muted)}
.back:active,.icon-btn:active{background:#0000000d}

/* Start */
.hero{padding:14px 0 22px;text-align:center}
.logo{width:84px;height:84px;border-radius:20px;overflow:hidden;margin:0 auto 14px;box-shadow:0 8px 22px rgba(108,92,231,.28)}
.logo svg{display:block}
.hero h1{font-size:33px;line-height:1.15}
.hero p{margin:8px 0 0;color:var(--muted);font-size:15px}
.hint{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.hint div{flex:1;font-size:14px;color:#454b47}
.hint b{display:block;font-family:Georgia,serif;font-weight:400;font-size:16.5px;color:var(--ink);margin-bottom:2px}
.hint .x{color:var(--muted);font-size:20px;line-height:1;padding:2px 4px}
.hint .go{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;font-size:14px}
.cont{display:block;width:100%;text-align:left;border-radius:20px;padding:18px 18px 16px;margin-bottom:14px;color:#fff;background:var(--accent);box-shadow:0 6px 18px rgba(31,42,38,.16)}
.cont[data-c="stricken"]{background:var(--knit)} .cont[data-c="haekeln"]{background:var(--crochet)}
.cont small{font-size:12.5px;opacity:.85;letter-spacing:.02em}
.cont .cn{display:block;font-family:Georgia,serif;font-size:22px;margin:2px 0 4px}
.cont .cm{font-size:14px;opacity:.9;font-variant-numeric:tabular-nums}
.cont .track{background:rgba(255,255,255,.28)} .cont .track i{background:#fff}
.cont:active{transform:scale(.99)}
.crafts{display:grid;gap:12px}
.craft{background:var(--card);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:18px;border:1px solid var(--line);width:100%;text-align:left;transition:transform .12s ease}
.craft:active{transform:scale(.985)}
.craft .cname{font-family:Georgia,serif;font-size:23px;display:block}
.craft .csub{color:var(--muted);font-size:13.5px}
.craft svg{flex:none}

/* Listen */
.plist{display:grid;gap:10px;margin-top:4px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;text-align:left;display:block}
.pcard:active{background:#faf9f6}
.prow{display:flex;align-items:baseline;gap:10px}
.pname{font-family:Georgia,serif;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{color:var(--muted);font-size:13px;margin-top:2px}
.pct{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s ease}
.done .pname{color:var(--muted)}
.librow{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:18px;padding:13px 16px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:14px}
.librow span:last-child{color:var(--accent);font-weight:600}
.empty{text-align:center;padding:40px 20px 20px;color:var(--muted)}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:6px}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(31,42,38,.22);z-index:20}
.fab:active{transform:scale(.94)}

/* Tabs */
.tabs{display:flex;gap:6px;background:#e7e4db;border-radius:12px;padding:4px;margin:2px 0 16px}
.tabs button{flex:1;padding:8px 0;border-radius:9px;font-size:14.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0000000f}

/* Zähler */
.section-name{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-variant-numeric:tabular-nums}
.instr{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;transition:box-shadow .2s}
.instr.change{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.instr .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.instr .rw{font-family:Georgia,serif;font-size:19px}
.instr .side{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.badge{font-size:12px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 9px;font-weight:600}
.instr p{margin:10px 0 0;font-size:17.5px;line-height:1.5}
.blockbar{display:flex;gap:4px;margin-top:14px}
.blockbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.blockbar i.on{background:var(--accent);opacity:.45}
.blockbar i.cur{background:var(--accent)}
.chips{display:flex;gap:5px;margin-top:14px}
.chip{flex:1;min-width:0;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid var(--line);color:var(--muted);background:var(--card)}
.chip.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.now{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.08);box-shadow:0 3px 8px rgba(42,32,56,.18)}
.chip i{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;font-weight:700;line-height:1;
  padding:2px 4px;border-radius:6px;background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.chip.now i{background:#fff}
.chiplegend{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)}
.lastdone{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin:0 0 8px}
.lastdone .ck{width:20px;height:20px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:2px}
.nexthint{font-size:13.5px;color:var(--accent);margin-top:10px;font-weight:500}
.stats{display:flex;gap:10px;margin:12px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.plus{width:100%;background:var(--accent);color:#fff;border-radius:22px;padding:26px 0 22px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 14px rgba(31,42,38,.16);transition:transform .08s ease;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.plus:active{transform:scale(.98)}
.plus .sign{font-size:46px;line-height:1;font-weight:300}
.plus .lbl{font-size:14px;opacity:.9}
.undo{display:flex;gap:10px;margin-top:12px}
.undo button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 0;font-size:14.5px;color:var(--muted)}
.undo button:active{background:#f3f1ec}
.aux{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 14px;margin-top:10px}
.aux .an{flex:1;text-align:left;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aux .av{min-width:36px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.rnd{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);background:#fbfaf7;touch-action:manipulation}
.rnd.sm{width:40px;height:40px;font-size:20px}
.rnd.big{background:var(--accent);border-color:var(--accent);color:#fff;width:64px;height:64px;font-size:30px}
.rnd.sm.big{width:40px;height:40px;font-size:20px}
.rnd:active{transform:scale(.94)}
.pnote{display:block;width:100%;text-align:left;margin-top:10px;background:#fbfaf6;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;color:#454b47;white-space:pre-wrap}
.links{display:flex;justify-content:center;gap:22px;margin-top:14px}
.links button{font-size:13.5px;color:var(--accent);font-weight:500}
.total{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;font-variant-numeric:tabular-nums}
.finish{margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 18px 20px;text-align:center}
.finish h3{font-size:22px;margin:10px 0 4px}
.finish p{margin:0;font-size:14.5px;color:var(--muted)}
.partsel{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.partsel button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--muted)}
.partsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* Feier */
.cele{position:relative;width:96px;height:96px;margin:0 auto}
.cele .ring{position:absolute;inset:14px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.cele i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);opacity:0;animation:burst .8s ease-out .15s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes burst{0%{opacity:.9;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(-46px)}}

.where{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 4px;margin-bottom:16px}
.where>b{font-family:Georgia,serif;font-weight:400;font-size:17px;display:block;margin-bottom:4px}
.where>p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:#454b47;margin:-2px 0 12px}
.chk input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt.hit{border-color:var(--accent);background:var(--accent-soft)}
.wsub{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.howto{margin:-4px 0 12px;font-size:13.5px;color:#454b47}
.howto summary{color:var(--accent);font-weight:600;cursor:pointer;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"› ";}
.howto[open] summary::before{content:"⌄ ";}
.howto p{margin:8px 0 0}
.wmiss{font-size:13.5px;color:#9c3226;margin:0 0 12px}
/* Feier */
.party{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 30%, #3b2f8f 0%, #1c1640 70%);animation:fadein .35s ease both}
.party canvas{position:absolute;inset:0;width:100%;height:100%}
.pcard2{position:relative;width:100%;max-width:360px;background:var(--card);border-radius:28px;padding:26px 22px 20px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.35);animation:popin .6s cubic-bezier(.2,1.5,.4,1) .15s both}
.mascot{width:108px;height:108px;margin:-74px auto 8px;border-radius:28px;overflow:hidden;box-shadow:0 10px 26px rgba(108,92,231,.45);
  animation:hop 1.1s ease-in-out .7s infinite}
.mascot svg{display:block;width:108px;height:108px}
.bubble{position:absolute;top:-58px;left:calc(50% + 50px);background:#FFC440;color:#2A2038;font-weight:800;font-size:15px;padding:6px 12px;
  border-radius:14px 14px 14px 4px;transform:rotate(8deg);animation:popin .5s cubic-bezier(.2,1.6,.4,1) .9s both}
.pcard2 h3{font-size:27px;line-height:1.15;margin:4px 0 8px}
.pcard2 .msg{margin:0 0 16px;color:#4a4456;font-size:15.5px;line-height:1.5}
.pstats{display:flex;gap:8px;margin-bottom:16px}
.pstats div{flex:1;background:var(--accent-soft);border-radius:14px;padding:10px 4px}
.pstats b{display:block;font-size:19px;color:var(--accent);font-variant-numeric:tabular-nums}
.pstats span{font-size:11.5px;color:var(--muted)}
.ptip{font-size:12.5px;color:var(--muted);margin-top:12px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-14px) rotate(-6deg)}55%{transform:translateY(0) rotate(4deg)}70%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.mascot,.bubble,.pcard2,.party{animation:none!important}}
/* Fester Zähler-Bildschirm */
body.fixed{overflow:hidden;overscroll-behavior:none}
body.fixed #app{display:flex;flex-direction:column;
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
body.fixed #app>.bar{flex:none;width:100%}
body.fixed .wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:0;width:100%}
body.fixed .tabs{flex:none;margin-bottom:12px}
body.fixed #tabbody{flex:1;min-height:0;display:flex;flex-direction:column}
.cmain{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 -18px;padding:2px 18px 14px}
.dock{flex:none;margin:0 -18px;padding:10px 18px 10px;background:var(--paper);box-shadow:0 -10px 18px -14px rgba(42,32,56,.35);position:relative;z-index:2}
.dstats{display:flex;gap:8px;margin-bottom:10px}
.dstat{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 4px;font-size:12px;color:var(--muted);white-space:nowrap}
.dstat b{font-size:16.5px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
body.fixed .plus{padding:19px 0 15px}
body.fixed .plus .sign{font-size:42px}
body.fixed .undo{margin-top:9px}
body.fixed .undo button{padding:11px 0}
.dock .total{margin-top:8px}
@media (max-height:720px){ .cmain .lastdone{display:none} .cmain .instr p{font-size:16.5px;margin-top:8px} .cmain .instr{padding:15px 16px 14px} .cmain .section-name{margin-bottom:6px} }
@media (max-height:620px){ body.fixed .plus{padding:14px 0 11px} body.fixed .plus .sign{font-size:34px} .dstats{margin-bottom:7px} }
/* Bilanz */
.stx{--or:#FC4C02;--sink:#242428;--sgr:#6D6D78;--sline:#ECECF0;position:fixed;inset:0;z-index:70;background:#fff;color:var(--sink);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:fadein .2s ease both}
.stx-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--sline);flex:none}
.stx-bar b{flex:1;text-align:center;font-size:17px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.stx-bar .icon-btn{color:var(--sink)}
.stx-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(30px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;width:100%}
.who{display:flex;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.who b{display:block;font-size:15.5px}
.who div span{font-size:13px;color:var(--sgr)}
.stx-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;margin:14px 0 14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:16px;column-gap:10px;padding:2px 0 18px;border-bottom:1px solid var(--sline)}
.sgrid span{display:block;font-size:12.5px;color:var(--sgr);margin-bottom:2px}
.sgrid b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sgrid small{font-size:13px;font-weight:600;color:var(--sgr)}
.stx-note{background:#FFF3EC;color:#8A3A12;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:14px 0 4px}
.goal{margin:16px 0 4px;padding:14px;border:1px solid var(--sline);border-radius:14px}
.goal-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.goal-top b{font-size:24px;font-weight:800;color:var(--or)}
.goal-top span{font-size:13.5px;color:var(--sgr)}
.gtrack{height:8px;border-radius:4px;background:var(--sline);overflow:hidden}
.gtrack i{display:block;height:100%;background:var(--or);border-radius:4px}
.goal p{margin:10px 0 0;font-size:14px;color:var(--sink)}
.sh{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:17px;margin:24px 0 10px}
.profw{border-bottom:1px solid var(--sline);padding-bottom:12px}
.prof{display:block;width:100%;height:110px}
.paxis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sgr);margin-top:4px}
.splits{font-size:14px}
.srow{display:grid;grid-template-columns:1.5fr 1.2fr .9fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--sline)}
.srow>span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.srow small{display:block;font-size:11.5px;color:var(--sgr);font-weight:400}
.shead{font-size:12px;color:var(--sgr);padding-top:0}
.shead>span:last-child{font-weight:400}
.srow.todo{color:var(--sgr)}
.pbar{position:relative;height:22px;display:flex;align-items:center}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:#FFE2D4;border-radius:4px}
.pbar em{position:relative;font-style:normal;font-weight:600;padding-left:6px;font-variant-numeric:tabular-nums}
.badges{display:grid;gap:10px}
.bdg{display:flex;gap:12px;align-items:center}
.bdg b{display:block;font-size:14.5px}
.bdg span{font-size:12.5px;color:var(--sgr)}
.tod{display:grid;gap:7px}
.trow{display:grid;grid-template-columns:92px 1fr 84px;gap:10px;align-items:center;font-size:13.5px}

<script>
"use strict";
const VERSION = "2.4";
const KEY = "lena-handarbeit";
const BACKUP_DAYS = 14;
const DAY = 86400000;

/* Absichtlich leer: Anleitungen kommen per JSON-Import und bleiben nur auf dem Gerät. */
const LIBRARY = [];

/* ============ Zustand ============ */
let state = load();
let view = {name:"home", craft:"stricken", projectId:null, tab:"zaehler", partIdx:0};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.projects)) return normalize(d); }
  }catch(e){}
  return normalize({version:1, projects:[]});
}
function normalize(d){
  d.library = Array.isArray(d.library) ? d.library : [];
  d.settings = Object.assign({wake:true, lastBackup:null, hideInstall:false}, d.settings||{});
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("Speichern fehlgeschlagen"); } }
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function slug(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || uid(); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function allPatterns(){ return [...LIBRARY, ...state.library]; }
function craftLabel(c){ return c==="haekeln" ? "Häkeln" : "Stricken"; }
function unitOf(x){ return (x && x.unit) || (x && x.craft==="haekeln" ? "Runde" : "Reihe"); }
function unitsOf(x){ return unitOf(x) + "n"; }
function pick(v, i){ return Array.isArray(v) ? (v[i] ?? v[0]) : v; }
function castOnOf(part, i){ return pick(part.castOn, i) || 0; }
function fmtDate(t){ return new Date(t).toLocaleDateString("de-DE", {day:"numeric", month:"long", year:"numeric"}); }
function daysText(p){ const d = Math.floor(((p.finished||Date.now())-p.created)/DAY); return d<1 ? "an einem Tag" : `in ${d+1} Tagen`; }
function sinceDays(t){ return Math.max(0, Math.floor((Date.now()-t)/DAY)); }

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const isStandalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);

/* ============ Reihen ausrollen ============ */
function buildRows(part, sizeIdx){
  const out = [];
  let stitches = castOnOf(part, sizeIdx);
  (part.sections||[]).forEach((sec, si)=>{
    const reps = pick(sec.repeats, sizeIdx) || 1;
    for(let r=0; r<reps; r++){
      sec.rows.forEach((row, ri)=>{
        const delta = pick(row.delta, sizeIdx) || 0;
        stitches += delta;
        out.push({sectionIdx:si, sectionName:sec.name, repeat:r+1, repeatTotal:reps,
          rowInBlock:ri+1, blockLen:sec.rows.length, side:row.side||"",
          text:pick(row.text, sizeIdx), delta, stitches});
      });
    }
  });
  return out;
}
const rowCache = new Map();
function projectRows(p, i){
  const k = p.id+"#"+i+"#"+(p.sizeIdx||0);
  let r = rowCache.get(k);
  if(!r){ r = buildRows(p.parts[i], p.sizeIdx||0); rowCache.set(k, r); }
  return r;
}
function totalRows(p){ return p.parts.reduce((s,_,i)=>s+projectRows(p,i).length, 0); }
function doneRows(p){ return p.parts.reduce((s,pt)=>s+(pt.row||0), 0); }
function progress(p){ if(p.mode==="free") return null; const t = totalRows(p); return t ? Math.round(doneRows(p)/t*100) : 0; }
function partDone(p, i){ return (p.parts[i].row||0) >= projectRows(p,i).length; }

/* ============ Display wachhalten ============ */
/* iOS erlaubt den Wake Lock nur direkt nach einem Tipp ("transient activation").
   Deshalb wird er bei jedem Tipp neu angefordert, solange er fehlt – nicht nur beim Rendern. */
let wakeLock = null, wakePending = false, wakeError = "";
const wakeSupported = ("wakeLock" in navigator);
function wakeNeeded(){ return state.settings.wake && view.name==="project"; }
function syncWake(){
  if(!wakeSupported) return;
  if(wakeNeeded()){
    if(wakeLock || wakePending) return;
    wakePending = true;
    navigator.wakeLock.request("screen").then(l=>{
      wakeLock = l; wakeError = ""; wakePending = false;
      l.addEventListener("release", ()=>{ wakeLock = null; updateWakeBadge(); });
      updateWakeBadge();
    }).catch(e=>{ wakePending = false; wakeLock = null; wakeError = (e && e.name) || "Fehler"; updateWakeBadge(); });
  }else if(wakeLock){
    const l = wakeLock; wakeLock = null; l.release().catch(()=>{}); updateWakeBadge();
  }
}
function wakeText(){
  if(!state.settings.wake) return "";
  if(!wakeSupported) return `<span class="wk off">Display geht aus · ab iOS 18.4</span>`;
  if(wakeLock) return `<span class="wk on">☀︎ Display bleibt an</span>`;
  if(wakeError) return `<span class="wk off">Display geht aus · tippen zum Aktivieren</span>`;
  return `<span class="wk off">Tippen, damit das Display anbleibt</span>`;
}
function updateWakeBadge(){ const el = document.getElementById("wakebadge"); if(el) el.innerHTML = wakeText(); }
["touchend","click"].forEach(t=>document.addEventListener(t, ()=>{ if(!wakeLock) syncWake(); }, {capture:true, passive:true}));

function celebration(){
  const dots = Array.from({length:10}, (_,i)=>`<i style="--a:${i*36}deg;animation-delay:${.12+i*.02}s"></i>`).join("");
  return `<div class="cele">${dots}<div class="ring">${CHECK}</div></div>`;
}

/* ============ Rendern ============ */
const app = document.getElementById("app");
function render(){
  document.body.dataset.craft = view.craft;
  if(view.name!=="project") document.body.classList.remove("fixed");
  if(view.name==="home") renderHome();
  else if(view.name==="list") renderList();
  else if(view.name==="project") renderProject();
  else if(view.name==="settings") renderSettings();
  window.scrollTo(0,0);
  syncWake();
}
function bar(title, back, right){
  return `<div class="bar">
    ${back?`<button class="back" data-back="${back}" aria-label="Zurück"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`:""}
    <h2>${esc(title)}</h2>${right||""}</div>`;
}
function wireBar(){ const b = app.querySelector("[data-back]"); if(b) b.onclick = ()=>{ view.name = b.dataset.back; render(); }; }
function openProject(p){ view.craft=p.craft; view.projectId=p.id; view.tab="zaehler"; view.partIdx=firstOpenPart(p); view.name="project"; render(); }
function firstOpenPart(p){ if(p.mode==="free") return 0; const i = p.parts.findIndex((_,k)=>!partDone(p,k)); return i<0 ? 0 : i; }

/* ---------- Start ---------- */
function backupDue(){
  if(!state.projects.length) return false;
  const ref = state.settings.lastBackup || Math.min(...state.projects.map(p=>p.created||Date.now()));
  return Date.now() - ref > BACKUP_DAYS*DAY;
}
function continueLine(p){
  if(p.mode==="free"){ const c=(p.counters||[])[0]; return c ? `${esc(c.name)}: ${c.value||0}` : "Freies Zählen"; }
  const i = firstOpenPart(p), part = p.parts[i], rows = projectRows(p,i);
  return `${p.parts.length>1?esc(part.name)+" · ":""}${unitOf(p)} ${Math.min((part.row||0)+1, rows.length)} von ${rows.length}`;
}
function renderHome(){
  const active = state.projects.filter(p=>p.status!=="fertig").sort((a,b)=>b.updated-a.updated)[0];
  const n = c => state.projects.filter(p=>p.craft===c && p.status!=="fertig").length;
  const sub = c => { const k=n(c); return k ? `${k} laufende${k===1?"s Projekt":" Projekte"}` : "Noch kein Projekt"; };
  const installHint = isIOS && !isStandalone && !state.settings.hideInstall;
  app.innerHTML = `
  <div class="bar" style="justify-content:flex-end"><button class="icon-btn" data-go="settings" aria-label="Einstellungen">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button></div>
  <div class="wrap">
    <div class="hero"><div class="logo">${LOGO}</div><h1>Lena Del Yarn</h1><p>Reihen zählen, ohne den Faden zu verlieren</p></div>
    ${installHint?`<div class="hint"><div><b>Als App auf den Home-Bildschirm</b>In Safari auf Teilen tippen, dann „Zum Home-Bildschirm“. Startet dann wie eine richtige App, und deine Projekte sind sicherer aufgehoben.</div><button class="x" data-hideinstall aria-label="Ausblenden">×</button></div>`:""}
    ${backupDue()?`<div class="hint"><div><b>Zeit für eine Sicherung</b>Deine Projekte liegen nur auf diesem Handy. ${state.settings.lastBackup?"Letzte Sicherung am "+fmtDate(state.settings.lastBackup)+".":"Du hast noch nie gesichert."}<br><button class="go" data-backup>Jetzt sichern</button></div></div>`:""}
    ${active?`<button class="cont" data-c="${active.craft}" data-cont><small>WEITER MIT</small><span class="cn">${esc(active.name)}</span><span class="cm">${continueLine(active)}</span>${progress(active)!==null?`<div class="track"><i style="width:${progress(active)}%"></i></div>`:""}</button>`:""}
    <div class="crafts">
      <button class="craft" data-pick="stricken">${ICON_KNIT}<span><span class="cname">Stricken</span><span class="csub">${sub("stricken")}</span></span></button>
      <button class="craft" data-pick="haekeln">${ICON_CROCHET}<span><span class="cname">Häkeln</span><span class="csub">${sub("haekeln")}</span></span></button>
    </div>
  </div>`;
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ view.craft=b.dataset.pick; view.name="list"; render(); });
  app.querySelector("[data-go=settings]").onclick=()=>{ view.name="settings"; render(); };
  const c = app.querySelector("[data-cont]"); if(c) c.onclick=()=>openProject(active);
  const h = app.querySelector("[data-hideinstall]"); if(h) h.onclick=()=>{ state.settings.hideInstall=true; save(); renderHome(); };
  const bk = app.querySelector("[data-backup]"); if(bk) bk.onclick=()=>{ doExport(); renderHome(); };
}

/* ---------- Projektliste ---------- */
function renderList(){
  const list = state.projects.filter(p=>p.craft===view.craft).sort((a,b)=>(a.status==="fertig")-(b.status==="fertig") || b.updated-a.updated);
  const lib = allPatterns().filter(t=>t.craft===view.craft);
  app.innerHTML = `
  ${bar(craftLabel(view.craft), "home")}
  <div class="wrap">
    ${list.length ? `<div class="plist">${list.map(projectCard).join("")}</div>` :
      `<div class="empty"><h3>Noch nichts angefangen</h3><p>Tippe auf das Plus, um eine Anleitung einzuspielen, ein Projekt zu starten oder frei zu zählen.</p></div>`}
    <button class="librow" data-lib><span>${lib.length ? `${lib.length} Anleitung${lib.length===1?"":"en"} in der Bibliothek` : "Noch keine Anleitung"}</span><span>${lib.length?"Verwalten":"Einspielen"}</span></button>
  </div>
  <button class="fab" data-new aria-label="Neues Projekt">+</button>`;
  wireBar();
  app.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openProject(state.projects.find(p=>p.id===el.dataset.open)));
  app.querySelector("[data-new]").onclick = newProjectSheet;
  app.querySelector("[data-lib]").onclick = ()=> lib.length ? librarySheet() : importSheet(view.craft);
}
function projectCard(p){
  const pct = progress(p);
  const sub = p.mode==="free" ? "Freies Zählen" : `${p.designer?p.designer+" · ":""}Größe ${p.sizeLabel||"–"}${p.parts.length>1?" · "+p.parts.length+" Teile":""}`;
  return `<button class="pcard ${p.status==="fertig"?"done":""}" data-open="${p.id}">
    <div class="prow"><span class="pname">${esc(p.name)}</span>${pct!==null?`<span class="pct">${p.status==="fertig"?"fertig":pct+"%"}</span>`:(p.status==="fertig"?`<span class="pct">fertig</span>`:"")}</div>
    <div class="pmeta">${esc(sub)}</div>
    ${pct!==null?`<div class="track"><i style="width:${pct}%"></i></div>`:""}</button>`;
}

  const lib = allPatterns().filter(t=>t.craft===view.craft);
  sheet(`<h3>Bibliothek · ${craftLabel(view.craft)}</h3>
    <p class="sub">Anleitungen auf diesem Gerät. Laufende Projekte bleiben erhalten, auch wenn du eine Anleitung löschst.</p>
    ${lib.map(t=>`<button class="opt" data-t="${esc(t.id)}"><b>${esc(t.name)}</b><span>${esc(t.designer||"")}${t.sizes?" · "+t.sizes.map(esc).join(", "):""}</span></button>`).join("")}
    <button class="btn ghost" data-imp>Weitere Anleitung einspielen</button>
    <button class="btn ghost" data-close>Schließen</button>`, el=>{
    el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ closeSheet(); patternSheet(allPatterns().find(t=>t.id===b.dataset.t)); });
    el.querySelector("[data-imp]").onclick=()=>{ closeSheet(); importSheet(view.craft); };
  });
}
function patternSheet(t){
  const inUse = state.projects.filter(p=>p.patternId===t.id).length;
  sheet(`<h3>${esc(t.name)}</h3>
    <p class="sub">${esc(t.designer||"")}${inUse?` · in ${inUse} Projekt${inUse===1?"":"en"} benutzt`:""}</p>
    <button class="btn" data-start>Projekt damit starten</button>
    <button class="btn ghost" data-ren>Umbenennen</button>
    <button class="btn ghost danger" data-del>Aus der Bibliothek löschen</button>
    <button class="btn ghost" data-close>Schließen</button>`, el=>{
    el.querySelector("[data-start]").onclick=()=>{ closeSheet(); sizeSheet(t); };
    el.querySelector("[data-ren]").onclick=()=>{ closeSheet(); textSheet("Anleitung umbenennen","Name",t.name,v=>{ t.name=v; save(); renderList(); }); };
    el.querySelector("[data-del]").onclick=()=>{ closeSheet(); confirmSheet(`„${t.name}“ löschen?`, "Die Anleitung verschwindet aus der Bibliothek. Projekte, die schon laufen, behalten ihre Kopie.", "Löschen", ()=>{
      state.library = state.library.filter(x=>x.id!==t.id); save(); renderList(); toast("Anleitung gelöscht"); }); };
  });
}

/* ============ Projekt ============ */
function currentProject(){ return state.projects.find(p=>p.id===view.projectId); }
function renderProject(){
  const p = currentProject();
  if(!p){ view.name="list"; return render(); }
  const right = `<button class="icon-btn" data-menu aria-label="Projekt-Menü"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>`;
  const tabs = p.mode==="free" ? [["zaehler","Zähler"],["info","Info"]] : [["zaehler","Zähler"],["anleitung","Anleitung"],["info","Info"]];
  // Kein Springen beim Neuzeichnen: Scrollposition merken, außer eine neue Reihe ist dran.
  const prevMain = document.querySelector(".cmain");
  const keepMain = prevMain && !view._resetScroll ? prevMain.scrollTop : 0;
  const keepY = view._resetScroll ? 0 : window.scrollY;
  view._resetScroll = false;
  const fixed = view.tab==="zaehler" && p.mode!=="free";
  document.body.classList.toggle("fixed", fixed);
  app.innerHTML = `${bar(p.name, "list", right)}
  <div class="wrap">
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${view.tab===k}">${l}</button>`).join("")}</div>
    <div id="tabbody"></div></div>`;
  wireBar();
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; view._resetScroll=true; renderProject(); });
  app.querySelector("[data-menu]").onclick = ()=>projectMenu(p);
  const body = document.getElementById("tabbody");
  if(view.tab==="zaehler"){ body.innerHTML = p.mode==="free" ? freeBody(p) : counterBody(p); p.mode==="free" ? wireFree(p) : wireCounter(p); }
  else if(view.tab==="anleitung"){ body.innerHTML = patternBody(p); wirePartSel(); }
  else { body.innerHTML = infoBody(p); wireInfo(p); }
  const main = document.querySelector(".cmain");
  if(main) main.scrollTop = keepMain;
  if(!fixed) window.scrollTo(0, keepY);
  syncWake();
}
function partSel(p, idx, mark){
  if(p.parts.length<2) return "";
  return `<div class="partsel">${p.parts.map((pt,i)=>`<button data-part="${i}" aria-pressed="${i===idx}">${esc(pt.name)}${mark&&partDone(p,i)?" ✓":""}</button>`).join("")}</div>`;
}
function wirePartSel(){ app.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{ view.partIdx=+b.dataset.part; view._resetScroll=true; renderProject(); }); }

/* ---- Zähler nach Anleitung ---- */
const CK = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
function mark(st){
  return `<span class="mk">${st==="done"?`<span class="ck">${CK}</span>`:st==="now"?`<span class="dotnow"></span>`:`<span class="ring"></span>`}</span>`;
}
function stOf(i, cur){ return i<cur ? "done" : i===cur ? "now" : "todo"; }

function changeWord(d){ return (d>0?"Zunahme":"Abnahme") + ` (${d>0?"+":""}${d} M)`; }
function counterBody(p){
  const idx = Math.min(view.partIdx, p.parts.length-1), part = p.parts[idx], rows = projectRows(p, idx);
  const U = unitOf(p), Us = unitsOf(p);
  const done = part.row||0;
  const extras = auxAndNote(part);

  if(done >= rows.length){
    const allDone = p.parts.every((_,i)=>partDone(p,i));
    const next = p.parts.findIndex((_,i)=>!partDone(p,i));
    return `<div class="cmain">${partSel(p, idx, true)}
      <div class="finish">${celebration()}
        <h3>${allDone ? (p.status==="fertig"?"Fertig!":"Geschafft!") : esc(part.name)+" ist fertig"}</h3>
        <p>${allDone ? `${totalRows(p)} ${Us} ${daysText(p)}. Jetzt nur noch die Fäden vernähen.` : `Weiter mit „${esc(p.parts[next].name)}“.`}</p>
        ${!allDone?`<button class="btn" data-nextpart="${next}">Zu „${esc(p.parts[next].name)}“</button>`:""}
        ${allDone && p.status!=="fertig"?`<button class="btn" data-complete>Projekt abschließen</button>`:""}
        ${allDone && p.status==="fertig"?`<button class="btn" data-showstats>Recap ansehen & teilen</button><button class="btn ghost" data-replay>Nochmal feiern 🎉</button>`:""}
      </div>
      ${extras}</div>
      <div class="dock"><div class="undo"><button data-minus>− Zurück</button><button data-jump>Springen</button></div></div>`;
  }

  const cur = rows[done];
  const stitchesNow = done>0 ? rows[done-1].stitches : castOnOf(part, p.sizeIdx||0);
  const blockStart = done - (cur.rowInBlock-1);
  const inBlock = cur.blockLen>1 && cur.repeatTotal>1;
  let dots = "";
  if(inBlock && cur.blockLen<=12){
    dots = `<div class="chips">${Array.from({length:cur.blockLen},(_,i)=>{
      const r = rows[blockStart+i], st = i+1<cur.rowInBlock?"done":(i+1===cur.rowInBlock?"now":"todo");
      return `<span class="chip ${st}" aria-label="${U} ${i+1}${st==="done"?" erledigt":st==="now"?" jetzt":" offen"}">${st==="done"?CK.replace('width="13" height="13"','width="15" height="15"'):i+1}${r&&r.delta?`<i>${r.delta>0?"+":""}${r.delta}</i>`:""}</span>`; }).join("")}</div>
`;
  }else if(inBlock){
    dots = `<div class="blockbar">${Array.from({length:cur.blockLen},(_,i)=>`<i class="${i+1<cur.rowInBlock?"on":(i+1===cur.rowInBlock?"cur":"")}"></i>`).join("")}</div>`;
  }
  const lastDone = done>0 ? `<div class="lastdone"><span class="ck">${CK}</span><span>${U} ${done} ist fertig</span></div>` : "";
  let hint = "";
  if(!cur.delta){
    const k = rows.findIndex((r,i)=>i>done && r.delta);
    if(k>0){ const dist = k-done; hint = dist===1 ? `Nächste ${U}: ${changeWord(rows[k].delta)}` : `${changeWord(rows[k].delta).split(" (")[0]} in ${dist} ${Us}`; }
  }
  const top = inBlock ? `${U} ${cur.rowInBlock} von ${cur.blockLen}` : `${U} ${done+1}`;
  return `<div class="cmain">${partSel(p, idx, true)}
    <div class="section-name"><span>${esc(cur.sectionName)}</span><span>${inBlock?`${U} ${done+1} von ${rows.length}`:`von ${rows.length} ${Us}`}</span></div>
    ${lastDone}
    <div class="instr ${cur.delta?"change":""}">
      <div class="eyebrow">Jetzt ${p.craft==="haekeln"?"häkeln":"stricken"}</div>
      <div class="top"><span class="rw">${top}</span><span class="side">${cur.delta?`<span class="badge">${cur.delta>0?"+":""}${cur.delta} M</span>`:""}${esc(cur.side)}</span></div>
      <p>${esc(cur.text)}</p>${dots}
      ${hint?`<div class="nexthint">${hint}</div>`:""}
    </div>
    ${extras}
    <div class="total">${p.parts.length>1?esc(part.name)+" · ":""}${done} von ${rows.length} ${Us} gezählt</div>
    </div>
    <div class="dock">
      <div class="dstats">
        <div class="dstat"><b>${cur.repeatTotal>1 ? cur.repeat+"/"+cur.repeatTotal : "–"}</b>Wdh.</div>
        <div class="dstat"><b>${stitchesNow}</b>Maschen</div>
        <div class="dstat"><b>${Math.round(done/rows.length*100)}%</b>fertig</div>
      </div>
      <button class="plus" data-plus><span class="sign">+</span><span class="lbl">${U} ${done+1} fertig</span></button>
      <div class="undo"><button data-minus>− Zurück</button><button data-jump>Springen</button></div>
      <div class="total" id="wakebadge">${wakeText()}</div>
    </div>`;
}
function auxAndNote(part){
  const aux = (part.aux||[]).map((a,i)=>`<div class="aux"><button class="an" data-auxedit="${i}">${esc(a.name)}</button>
    <button class="rnd sm" data-auxminus="${i}" aria-label="${esc(a.name)} minus">−</button><span class="av">${a.value||0}</span>
    <button class="rnd sm big" data-auxplus="${i}" aria-label="${esc(a.name)} plus">+</button></div>`).join("");
  return `${aux}${part.note?`<button class="pnote" data-note>${esc(part.note)}</button>`:""}
    <div class="links"><button data-auxadd>+ Nebenzähler</button><button data-note>${part.note?"Notiz ändern":"+ Notiz"}</button></div>`;
}
let lastPlus = 0;
function wireCounter(p){
  const idx = Math.min(view.partIdx, p.parts.length-1), part = p.parts[idx], rows = projectRows(p, idx), U = unitOf(p);
  const touch = ()=>{ const fin = syncStatus(p); p.updated = Date.now(); save(); renderProject(); if(fin) celebrate(p); };
  const touchRow = ()=>{ view._resetScroll = true; touch(); };
  wirePartSel();
  const plus = app.querySelector("[data-plus]");
  if(plus) plus.onclick = ()=>{
    const now = Date.now(), gap = now - lastPlus;
    if(gap < 450) return;                // Doppeltipp abfangen
    lastPlus = now;
    const before = part.row||0;
    if(before >= rows.length) return;
    part.row = before+1; logRow(p, idx, part.row); touchRow();
    if(gap < 2500) toast(`${U} ${before+1} gezählt`, "Rückgängig", ()=>{ if(part.row!==before+1) return; part.row = before; unlogRow(p, idx, before); touchRow(); });
  };
  app.querySelectorAll("[data-minus]").forEach(b=>b.onclick = ()=>{ if(!(part.row>0)) return; part.row--; unlogRow(p, idx, part.row); touchRow(); });
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick = ()=>jumpSheet(p, idx));
  const np = app.querySelector("[data-nextpart]"); if(np) np.onclick = ()=>{ view.partIdx = +np.dataset.nextpart; view._resetScroll = true; renderProject(); };
  const comp = app.querySelector("[data-complete]"); if(comp) comp.onclick = ()=>touch();
  const rep = app.querySelector("[data-replay]"); if(rep) rep.onclick = ()=>celebrate(p);
  const shs = app.querySelector("[data-showstats]"); if(shs) shs.onclick = ()=>showStats(p);
  wireExtras(p, part, touch);
}
function wireExtras(p, part, touch){
  app.querySelectorAll("[data-auxplus]").forEach(b=>b.onclick=()=>{ const a=part.aux[+b.dataset.auxplus]; a.value=(a.value||0)+1; touch(); });
  app.querySelectorAll("[data-auxminus]").forEach(b=>b.onclick=()=>{ const a=part.aux[+b.dataset.auxminus]; a.value=Math.max(0,(a.value||0)-1); touch(); });
  app.querySelectorAll("[data-auxedit]").forEach(b=>b.onclick=()=>auxSheet(part, +b.dataset.auxedit, touch));
  const add = app.querySelector("[data-auxadd]"); if(add) add.onclick=()=>auxSheet(part, null, touch);
  app.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{
    sheet(`<h3>Notiz${p.parts.length>1?" zu „"+esc(part.name)+"“":""}</h3>
      <div class="field"><textarea id="nt" placeholder="z. B. Maschenmarkierer nach der 3. Masche">${esc(part.note||"")}</textarea></div>
      <button class="btn" data-ok>Speichern</button><button class="btn ghost" data-close>Abbrechen</button>`, el=>{
      el.querySelector("[data-ok]").onclick=()=>{ part.note = el.querySelector("#nt").value.trim(); closeSheet(); touch(); };
    });
  });
}
function auxSheet(part, i, touch){
  const a = i===null ? {name:"", value:0} : part.aux[i];
  sheet(`<h3>${i===null?"Nebenzähler":"Nebenzähler bearbeiten"}</h3>
    <p class="sub">Läuft unabhängig von der Anleitung – etwa für Maschen in der Reihe, Farbwechsel oder eine zweite Formung „gleichzeitig“.</p>
    <div class="field"><label for="an">Name</label><input id="an" value="${esc(a.name)}" placeholder="z. B. Ausschnitt"></div>
    <div class="field"><label for="av">Stand</label><input id="av" type="number" inputmode="numeric" value="${a.value||0}"></div>

}
/* Sucht alle Stellen, an denen gerade "maschen" Maschen auf der Nadel liegen,
   und rechnet die "seit" Reihen seit der letzten Maschenänderung dazu. */
function locate(p, idx, maschen, seit){
  const part = p.parts[idx], rows = projectRows(p, idx);
  const before = j => j===0 ? castOnOf(part, p.sizeIdx||0) : rows[j-1].stitches;
  const out = [];
  let j = 0;
  while(j <= rows.length){
    if(before(j)!==maschen){ j++; continue; }
    const start = j;
    while(j+1 <= rows.length && before(j+1)===maschen) j++;
    const end = j;                      // letzte Position mit dieser Maschenzahl
    const pos = start + seit;
    if(pos <= end) out.push({pos, section: rows[Math.min(pos, rows.length-1)].sectionName, span:end-start});
    j++;
  }
  return out;
}
function jumpSheet(p, idx){
  const part = p.parts[idx], rows = projectRows(p, idx), U = unitOf(p), Us = unitsOf(p);
  const secs = []; rows.forEach((r,i)=>{ if(!secs.length || secs[secs.length-1].idx!==r.sectionIdx) secs.push({idx:r.sectionIdx, name:r.sectionName, start:i}); });
  const hasChanges = rows.some(r=>r.delta);
  const knit = p.craft!=="haekeln";
  const curSt = (part.row||0)>0 ? rows[Math.min(part.row,rows.length)-1].stitches : castOnOf(part, p.sizeIdx||0);
  sheet(`<h3>Springen</h3>
    <p class="sub">Gezählt: ${part.row||0} von ${rows.length} ${Us}</p>
    ${hasChanges?`<div class="where">
      <b>Wo bin ich?</b>
      <p>Zähl die Maschen auf der Nadel und ${knit?"die Wellen":`die ${Us}`} seit der letzten Zu- oder Abnahme – die App findet die Stelle.</p>
      ${knit?`<details class="howto"><summary>So zählst du die Wellen</summary>
        <p>Kraus rechts bildet kleine Wellen, die <b>parallel zur Nadel</b> laufen. Jede Welle sind 2 Reihen, die neueste liegt direkt an der Nadel.</p>
        <p>An der Kante mit den Zunahmen nach der letzten Zunahme suchen: ein kleines Knötchen, an dem die Kante einen winzigen Schritt nach außen macht. Von dort bis zur Nadel die Wellen zählen.</p>
        <p>Welche Reihe als Nächstes kommt, zeigt der Arbeitsfaden: An seiner Ecke beginnt die nächste Reihe.</p>
      </details>`:""}
      <div class="two">
        <div class="field"><label for="wm">Maschen auf der Nadel</label><input id="wm" type="number" inputmode="numeric" min="0" placeholder="${curSt}"></div>
        <div class="field"><label for="ws">${knit?"Wellen seit Änderung":Us+" seit Änderung"}</label><input id="ws" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      </div>
      ${knit?`<label class="chk"><input type="checkbox" id="wr" checked> Ich habe Wellen gezählt (1 Welle = 2 Reihen)</label>`:""}
      <div id="wres"></div>
    </div>`:""}
    <div class="field"><label for="jr">Oder direkt: fertige ${Us}</label><input id="jr" type="number" inputmode="numeric" min="0" max="${rows.length}" value="${part.row||0}"></div>
    <button class="btn ghost" data-ok>Übernehmen</button>
    <p class="sub" style="margin:18px 0 8px">Oder an den Anfang eines Abschnitts</p>
    ${secs.map(s=>`<button class="opt" data-sec="${s.start}"><b>${esc(s.name)}</b><span>ab ${U} ${s.start+1}</span></button>`).join("")}
    <button class="btn ghost" data-close>Abbrechen</button>`, el=>{
    const set = v=>{ part.row = Math.max(0, Math.min(rows.length, v)); logRow(p, idx, part.row, true); view._resetScroll = true; const fin = syncStatus(p); p.updated=Date.now(); save(); closeSheet(); renderProject();
      if(fin) celebrate(p); else toast(`Weiter bei ${U} ${Math.min(part.row+1, rows.length)}`); };
    el.querySelector("[data-ok]").onclick = ()=>set(parseInt(el.querySelector("#jr").value||"0",10));
    el.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>set(+b.dataset.sec));
    if(!hasChanges) return;
    const res = el.querySelector("#wres");
    const calc = ()=>{
      const rb = el.querySelector("#wr");
      const waves = !!(rb && rb.checked);
      el.querySelector('label[for="ws"]').textContent = waves ? "Wellen seit Änderung" : `${Us} seit Änderung`;
      const mv = el.querySelector("#wm").value;
      if(mv===""){ res.innerHTML=""; return; }
      const m = parseInt(mv,10);
      const n = Math.max(0, parseInt(el.querySelector("#ws").value||"0",10)||0);
      const tries = waves ? [2*n, 2*n+1] : [n];
      const hits = [];
      tries.forEach(s=>locate(p, idx, m, s).forEach(x=>{ if(!hits.some(y=>y.pos===x.pos)) hits.push(x); }));
      hits.sort((a,b)=>a.pos-b.pos);
      if(!hits.length){
        const any = locate(p, idx, m, 0);
        const maxW = any.length ? Math.max(...any.map(a=>a.span)) : 0;
        res.innerHTML = `<p class="wmiss">${any.length
          ? `Mit ${m} Maschen gibt es höchstens ${waves?Math.floor(maxW/2)+" Wellen":maxW+" "+Us} am Stück. Bitte noch einmal zählen.`
          : `${m} Maschen kommen in dieser Größe nicht vor. Vielleicht verzählt – oder eine andere Größe?`}</p>`;
        return;
      }
      const phases = new Set(hits.map(h=>h.section)).size;
      const notes = [];
      if(phases>1) notes.push("Diese Maschenzahl gibt es zweimal – oben wird der Schal breiter, unten schmaler.");
      if(waves) notes.push("Eine Welle kann halb fertig sein. Wo der Arbeitsfaden hängt, beginnt die nächste Reihe – danach wählen.");
      res.innerHTML = notes.map(t=>`<p class="wsub">${t}</p>`).join("") +
        hits.map(h=>{ const nxt = rows[Math.min(h.pos, rows.length-1)];
          return `<button class="opt hit" data-hit="${h.pos}"><b>${h.pos>=rows.length?"Fertig":U+" "+(h.pos+1)+" als Nächstes"}${h.pos<rows.length&&nxt.side?` · ${esc(nxt.side)}`:""}</b><span>${esc(h.section)} · ${h.pos} ${Us} fertig</span></button>`; }).join("");
      res.querySelectorAll("[data-hit]").forEach(b=>b.onclick=()=>set(+b.dataset.hit));
    };
    // Nur bei echten Änderungen neu zeichnen – sonst schluckt das Neuzeichnen beim Verlassen des Feldes den Tipp auf einen Treffer.
    let last = "";
    const recalc = ()=>{ const rb = el.querySelector("#wr");
      const key = [el.querySelector("#wm").value, el.querySelector("#ws").value, rb && rb.checked].join("|");
      if(key===last) return; last = key; calc(); };
    ["#wm","#ws"].forEach(s=>el.querySelector(s).addEventListener("input", recalc));
    const rbx = el.querySelector("#wr"); if(rbx) rbx.addEventListener("change", recalc);
  });
}

/* ---- Anleitung ---- */
function patternBody(p){
  const idx = Math.min(view.partIdx, p.parts.length-1), part = p.parts[idx], rows = projectRows(p, idx), cur = part.row||0, U = unitOf(p), Us = unitsOf(p);
  const curRow = rows[Math.min(cur, rows.length-1)];
  const secs = [];
  rows.forEach((r,i)=>{ const s = secs[secs.length-1];
    if(!s || s.idx!==r.sectionIdx) secs.push({idx:r.sectionIdx, name:r.sectionName, reps:r.repeatTotal, blockLen:r.blockLen, start:i, end:i});
    else s.end = i; });
  const range = (a,b)=> a===b ? `${U} ${a+1}` : `${Us} ${a+1}–${b+1}`;
  const deltaTag = (r, repeated)=> r.delta ? ` <em>${r.delta>0?"+":""}${r.delta} M${repeated?"":" → "+r.stitches}</em>` : "";
  return `${partSel(p, idx, false)}
    <div class="note"><h3>Anschlag</h3><p>${castOnOf(part, p.sizeIdx||0) ? castOnOf(part, p.sizeIdx||0)+" Maschen" : "Ohne Anschlag"}${p.meta&&p.meta.needle?" · "+esc(p.meta.needle):""}</p></div>
    ${secs.map(s=>{
      const here = cur<rows.length && cur>=s.start && cur<=s.end;
      const secSt = cur>s.end ? "done" : here ? "now" : "todo";
      const def = part.sections[s.idx];
      let body;
      if(s.reps>1 && s.blockLen===1){
        const r = rows[s.start], k = here ? cur-s.start : 0;
        body = `<div class="rline ${secSt}">${mark(secSt)}<span class="n">${range(s.start,s.end)}${here?`<span class="nowpill">${k+1}/${s.reps}</span>`:""}</span><span>${esc(r.text)}${deltaTag(r,true)}</span></div>`;
      }else if(s.reps>1){
        const doneReps = secSt==="done" ? s.reps : here ? curRow.repeat-1 : 0;
        body = `<div class="durch">${mark(secSt==="done"?"done":"todo").replace('ring"','ring" style="opacity:0"')}<div class="tx">${secSt==="done"
              ? `Alle <b>${s.reps}</b> Durchgänge fertig`
              : here ? `Durchgang <b>${curRow.repeat} von ${s.reps}</b> · ${doneReps} fertig` : `${s.reps} Durchgänge à ${s.blockLen} ${Us}`}
            <div class="track"><i style="width:${Math.round(doneReps/s.reps*100)}%"></i></div></div></div>` +
          def.rows.map((_,ri)=>{ const r = rows[s.start+ri];
            const st = secSt!=="now" ? secSt : (ri+1<curRow.rowInBlock?"done":ri+1===curRow.rowInBlock?"now":"todo");
            return `<div class="rline ${st}">${mark(st)}<span class="n">${ri+1}. ${esc(r.side)}${st==="now"?`<span class="nowpill">Jetzt</span>`:""}</span><span>${esc(r.text)}${deltaTag(r,true)}</span></div>`; }).join("");
      }else{
        body = rows.slice(s.start, s.end+1).map((r,k)=>{ const st = stOf(s.start+k, cur);
          return `<div class="rline ${st}">${mark(st)}<span class="n">${U==="Runde"?"Rd":"R"} ${s.start+k+1} ${esc(r.side)}${st==="now"?`<span class="nowpill">Jetzt</span>`:""}</span><span>${esc(r.text)}${deltaTag(r,false)}</span></div>`; }).join("");
      }
      const status = secSt==="done" ? `<span class="st ok">${CK} fertig</span>`
        : here ? `<span class="st run">läuft · ${Math.round((cur-s.start)/(s.end-s.start+1)*100)}%</span>`
        : `<span class="st">${range(s.start,s.end)}</span>`;
      return `<details class="sec ${secSt==="done"?"secdone":""}" ${here?"open":""}><summary><span>${esc(s.name)}${s.reps>1?` · ${s.reps}×`:""}</span>${status}</summary><div class="rows">${body}</div></details>`;
    }).join("")}
    ${(p.glossary||[]).length?`<div class="note"><h3>Abkürzungen</h3>${p.glossary.map(g=>`<p><b>${esc(g.term)}</b> — ${esc(g.text)}</p>`).join("")}</div>`:""}
    ${(p.notes||[]).map(n=>`<div class="note"><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></div>`).join("")}`;
}

/* ============ Zeitmessung & Bilanz ============ */
const GAP = 25*60e3;               // längere Pausen zählen nicht als Strickzeit
function doneCount(p){ return p.mode==="free" ? (p.counters||[]).reduce((s,c)=>s+(c.value||0),0) : doneRows(p); }
// Eintrag: [Zeit, erledigt gesamt, Sprung?, Teil, Reihe im Teil]
function logRow(p, pi, r, jump){
  p.log = p.log||[];
  p.log.push([Date.now(), doneCount(p), jump?1:0, pi, r]);
  if(p.log.length>5000) p.log.splice(0, p.log.length-5000);
}
function unlogRow(p, pi, r){
  const L = p.log||[], last = L[L.length-1];
  if(last && !last[2] && last[1]===doneCount(p)+1) L.pop(); else logRow(p, pi, r, true);
}
function median(a){ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function fmtDur(ms, approx){
  const m = Math.round(ms/60000), pre = approx?"~":"";
  if(m<1) return pre+"<1 min";
  if(m<60) return pre+m+" min";
  const h = Math.floor(m/60), r = m%60;
  return pre+h+" h"+(r?" "+r+" min":"");
}
function fmtPace(ms){ const s = Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function fmtShort(t){ return new Date(t).toLocaleDateString("de-DE",{day:"numeric",month:"short"}); }
function fmtNum(n){ return Number(n).toLocaleString("de-DE"); }

function projStats(p){
  const L = (p.log||[]).filter(Array.isArray).slice().sort((a,b)=>a[0]-b[0]);
  const durs = [], sessions = [];
  let s = null, prev = null;
  for(const e of L){
    const cont = prev && e[0]-prev[0] < GAP;
    if(!cont){ s = {start:e[0], end:e[0], rows:0, dur:0, open:0, opens:[]}; sessions.push(s); }
    if(!e[2]){
      s.rows++;
      if(cont && e[1]===prev[1]+1){ const d = e[0]-prev[0]; durs.push({d, t:e[0], pi:e[3], r:e[4]}); s.dur += d; }
      else { s.open++; s.opens.push(e); }
    }
    s.end = e[0]; prev = e;
  }
  const sess = sessions.filter(x=>x.rows>0);
  const med = median(durs.map(x=>x.d));
  const enough = durs.length>=3;
  const timedRows = sess.reduce((a,x)=>a+x.rows,0);
  const D = doneCount(p);
  const est = Math.max(0, D - timedRows);
  const measured = sess.reduce((a,x)=>a+x.dur+x.open*med,0);
  const total = measured + est*med;
  const T = p.mode==="free" ? 0 : totalRows(p);
  const remaining = Math.max(0, T - D);
  // Tempo pro Kalendertag seit Beginn der Messung
  let eta = null;
  if(enough && remaining>0 && L.length){
    const days = Math.max(1, (Date.now()-L[0][0])/DAY);
    const perDay = timedRows/days;
    if(perDay>0) eta = Date.now() + remaining/perDay*DAY;
  }
  // Verteilung
  const tod = [["Morgens",5,11],["Mittags",11,15],["Nachmittags",15,18],["Abends",18,22],["Nachts",22,29]].map(x=>({name:x[0],a:x[1],b:x[2],ms:0}));
  const wd = Array(7).fill(0);
  const addTime = (t, ms)=>{ const d = new Date(t), h = d.getHours(), hh = h<5?h+24:h;
    const b = tod.find(x=>hh>=x.a && hh<x.b); if(b) b.ms += ms; wd[(d.getDay()+6)%7] += ms; };
  durs.forEach(x=>addTime(x.t, x.d));
  sess.forEach(x=>x.opens.forEach(e=>addTime(e[0], med)));
  // Bestleistungen
  const real = durs.filter(x=>x.d>=15000);
  const fastest = real.length ? real.reduce((a,b)=>b.d<a.d?b:a) : null;
  const longest = sess.length ? sess.reduce((a,b)=>(b.dur+b.open*med)>(a.dur+a.open*med)?b:a) : null;
  const byDay = {};
  L.filter(e=>!e[2]).forEach(e=>{ const k = new Date(e[0]).toDateString(); byDay[k] = (byDay[k]||0)+1; });
  const bestDayKey = Object.keys(byDay).sort((a,b)=>byDay[b]-byDay[a])[0];
  const hours = L.filter(e=>!e[2]).map(e=>new Date(e[0]).getHours());
  const night = hours.some(h=>h>=22||h<4), early = hours.some(h=>h>=4&&h<8);
  // Abschnitte
  const splits = [];
  if(p.mode!=="free"){
    const timed = {}; durs.forEach(x=>{ timed[x.pi+":"+x.r] = x.d; });
    p.parts.forEach((pt,pi)=>{
      const rows = projectRows(p,pi), doneHere = pt.row||0;
      let i = 0;
      while(i<rows.length){
        const si = rows[i].sectionIdx, start = i;
        while(i<rows.length && rows[i].sectionIdx===si) i++;
        const end = i;                                  // exklusiv
        const doneSec = Math.max(0, Math.min(doneHere, end)-start);
        const ds = []; for(let r=start+1; r<=start+doneSec; r++){ const v = timed[pi+":"+r]; if(v!=null) ds.push(v); }
        const secMed = ds.length>=2 ? median(ds) : med;
        const time = ds.reduce((a,b)=>a+b,0) + (doneSec-ds.length)*secMed;
        splits.push({name:(p.parts.length>1?pt.name+" · ":"")+rows[start].sectionName, rows:end-start, done:doneSec,
          time, pace:secMed, approx:doneSec>ds.length, measured:ds.length});
      }
    });
  }
  // Maschen
  let stitches = 0, profile = [], pos = 0;
  if(p.mode!=="free"){
    p.parts.forEach((pt,pi)=>{ const rows = projectRows(p,pi);
      rows.forEach((r,ri)=>{ profile.push(r.stitches); if(ri<(pt.row||0)) stitches += r.stitches; });
      pos += Math.min(pt.row||0, rows.length); });
  }
  return {L, durs, sess, med, enough, timedRows, D, est, total, T, remaining, eta, tod, wd, fastest, longest,
    bestDay: bestDayKey ? {key:bestDayKey, rows:byDay[bestDayKey]} : null, night, early, splits, stitches, profile, pos,
    since: L.length ? L[0][0] : null};
}

    <circle cx="17" cy="21" r="11" fill="${col}"/><circle cx="17" cy="21" r="7.5" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7"/>
    <path d="M17 15.8l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" fill="#fff"/></svg>`;

function hm(ms){ const m = Math.round(ms/60000); return m<60 ? m+"m" : Math.floor(m/60)+"h "+(m%60)+"m"; }
function recapData(p, st){
  const fin = p.status==="fertig", free = p.mode==="free";
  const days = Math.max(1, Math.floor(((p.finished||Date.now())-p.created)/DAY)+1);
  const pct = st.T ? Math.round(st.D/st.T*100) : 0;
  const fav = st.enough ? st.tod.slice().sort((a,b)=>b.ms-a.ms)[0] : null;
  const tea = st.enough ? Math.round(st.total/(15*60e3)) : 0;
  const unitShort = free ? "Z." : (unitOf(p)==="Runde" ? "Rd" : "R");
  const stats = [
    [free ? "Gezählt" : unitsOf(p), fmtNum(st.D)],
    ["Ø Tempo", st.enough ? fmtPace(st.med)+" /"+unitShort : "–"],
    ["Zeit", st.enough ? (st.est>0?"~":"")+hm(st.total) : days+" "+(days===1?"Tag":"Tage")]
  ];
  const when = new Date(p.finished||Date.now()).toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"});
  const meta = `${when} · ${p.craft==="haekeln"?"Häkeln":"Stricken"}`;

/* Form des Strickstücks als "Route".
   form: "einseitig" (eine Kante gerade, z. B. Sophie Scarf), "beidseitig" (symmetrisch, z. B. Dreieckstuch),
   "rund" (in Runden, von der Seite gesehen, z. B. Mütze oder Amigurumi). */
const FORMS = ["einseitig","beidseitig","rund"];
function pieceSpec(p){
  if(p.mode==="free" || !p.parts || !p.parts.length) return [];
  const defForm = p.craft==="haekeln" ? "rund" : "einseitig";
  const defRh = p.craft==="haekeln" ? 0.9 : 0.5;
  const sz = p.sizeIdx||0;
  return p.parts.map((pt,i)=>({
    name: pt.name,
    P: [castOnOf(pt, sz), ...projectRows(p,i).map(r=>r.stitches)],
    form: FORMS.includes(pt.form) ? pt.form : FORMS.includes(p.form) ? p.form : defForm,
    rh: +(pt.reihenhoehe || p.reihenhoehe || defRh)
  })).filter(x=>x.P.length>1);

function pieceGeom(spec){
  const half = v => spec.form==="rund" ? v/Math.PI/2 : v/2;
  const top = [], bot = [];
  spec.P.forEach((v,i)=>{ const x = i*spec.rh;
    if(spec.form==="einseitig"){ top.push([x, -v]); bot.push([x, 0]); }
    else { top.push([x, -half(v)]); bot.push([x, half(v)]); } });
  let wi = 0; spec.P.forEach((v,i)=>{ if(v>spec.P[wi]) wi = i; });
  return {top, bot, wide:wi};

function drawRoute(c, p, st, box, opt){

    c.fillStyle = opt.fill||"rgba(252,76,2,.2)"; c.beginPath(); c.arc(cx,cy,R,0,7); c.fill();
    c.strokeStyle = opt.ridge||"rgba(252,76,2,.4)"; c.lineWidth = opt.lw*0.5;

      return {x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys)}; });

    let cx = 0; const offs = bbs.map(b=>{ const o = [cx - b.x0, -(b.y0+b.y1)/2]; cx += (b.x1-b.x0) + gap; return o; });
    const W = cx - gap, s = Math.min(box.w/W, box.h/H);

function mapBackground(c, x, y, w, h){
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.fillStyle = "#E9ECEF"; c.fillRect(x,y,w,h);
  // Maschen als Karten-Textur

  const st = 44;
  for(let yy=y-st; yy<y+h+st; yy+=st*1.02) for(let xx=x-st; xx<x+w+st; xx+=st*0.92){
    const o = (Math.round((yy-y)/st)%2) ? st*0.46 : 0;
    c.beginPath(); c.moveTo(xx+o-12, yy-13); c.lineTo(xx+o, yy+11); c.lineTo(xx+o+12, yy-13); c.stroke(); }
  // "Straßen"
  let sd = 5; const rnd = ()=>{ sd = (sd*16807)%2147483647; return sd/2147483647; };
  c.strokeStyle = "#FFFFFF"; c.lineCap = "round";
  for(let i=0;i<7;i++){ c.lineWidth = i<2 ? 22 : 12; c.beginPath();
    const vert = i%2, a = rnd();
    if(vert){ const sx = x+w*a; c.moveTo(sx, y-20); c.bezierCurveTo(sx+rnd()*300-150, y+h*0.35, sx+rnd()*300-150, y+h*0.7, sx+rnd()*200-100, y+h+20); }
    else { const sy = y+h*a; c.moveTo(x-20, sy); c.bezierCurveTo(x+w*0.35, sy+rnd()*300-150, x+w*0.7, sy+rnd()*300-150, x+w+20, sy+rnd()*200-100); }
    c.stroke(); }
  c.fillStyle = "rgba(194,226,190,.55)"; c.beginPath(); c.ellipse(x+w*0.82, y+h*0.2, 150, 100, 0.4, 0, 7); c.fill();
  c.fillStyle = "rgba(180,214,240,.6)"; c.beginPath(); c.ellipse(x+w*0.12, y+h*0.85, 190, 120, -0.3, 0, 7); c.fill();

}

function syncStatus(p){
  if(p.mode==="free") return false;
  const all = p.parts.every((_,i)=>partDone(p,i));
  if(all && p.status!=="fertig"){ p.status="fertig"; p.finished=Date.now(); return true; }
  if(!all && p.status==="fertig"){ p.status="laufend"; p.finished=null; }
  return false;
}
